<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="../branding/octo-industries-logo-source.jpg" type="image/jpeg">
  <title>Game Room | Choose a game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      --ink: #f4f7ff;
      --muted: #9ba7bd;
      --paper: #0b1020;
      --line: rgba(220, 229, 255, .14);
      --yellow: #f7c948;
      --coral: #f47d67;
      --blue: #5d9cec;
      --green: #72b79c;
      --panel: #131b2d;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--paper); }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      background:
        linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px),
        radial-gradient(circle at 8% 6%, rgba(247, 201, 72, .15), transparent 22rem),
        radial-gradient(circle at 94% 34%, rgba(93, 156, 236, .13), transparent 25rem),
        var(--paper);
      background-size: 42px 42px, 42px 42px, auto, auto, auto;
    }

    .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 22px;
      border-bottom: 1px solid var(--line);
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand { gap: 10px; }
    .brand-icon { display: block; width: 42px; height: 42px; flex: 0 0 auto; overflow: hidden; border-radius: 50%; background: #11131a; }
    .brand-icon img { display: block; width: 100%; height: 100%; object-fit: cover; mix-blend-mode: screen; }

    .status {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .intro { padding: 76px 0 44px; max-width: 700px; }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--yellow);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(44px, 7vw, 78px);
      line-height: .98;
      letter-spacing: -.055em;
    }

    .intro p:last-child {
      max-width: 520px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
    }

    .catalog-tools { display: flex; gap: 10px; margin: 0 0 24px; }
    .catalog-tools input, .catalog-tools select { min-height: 42px; border: 1px solid var(--line); border-radius: 8px; padding: 0 13px; color: var(--ink); background: rgba(19, 27, 45, .9); font: inherit; }
    .catalog-tools input { width: min(360px, 100%); }
    .catalog-tools select { color: var(--muted); }
    .catalog-tools input:focus, .catalog-tools select:focus { border-color: var(--yellow); outline: 2px solid rgba(247, 201, 72, .22); outline-offset: 2px; }

    .games {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 18px;
      padding-bottom: 56px;
    }

    .game-card {
      position: relative;
      display: flex;
      min-height: 280px;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      grid-column: span 2;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--ink);
      text-decoration: none;
      background: linear-gradient(145deg, rgba(28, 39, 62, .98), rgba(15, 22, 39, .98));
      box-shadow: 0 16px 34px rgba(0, 0, 0, .28), inset 0 1px rgba(255, 255, 255, .05);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .game-card:nth-child(4) { grid-column: 2 / span 2; }

    .game-card:hover,
    .game-card:focus-visible {
      transform: translateY(-6px) rotate(-.5deg);
      box-shadow: 0 22px 42px rgba(0, 0, 0, .4), 0 0 0 1px rgba(247, 201, 72, .28);
      outline: none;
    }

    .game-card:focus-visible { box-shadow: 0 0 0 4px var(--yellow), 0 22px 42px rgba(0, 0, 0, .4); }

    .art {
      position: relative;
      display: grid;
      min-height: 135px;
      place-items: center;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, .15);
      background: linear-gradient(135deg, var(--card-color, var(--blue)), color-mix(in srgb, var(--card-color, var(--blue)) 48%, #10182b));
    }

    .art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, transparent 48%, rgba(255, 255, 255, .12) 49%, transparent 51%); pointer-events: none; }

    .art img { width: 82%; max-height: 115px; object-fit: contain; }

    .icon-blocks { display: flex; gap: 7px; transform: rotate(-8deg); }
    .icon-blocks span { width: 34px; height: 34px; border: 3px solid var(--ink); border-radius: 6px; background: var(--yellow); box-shadow: 3px 3px 0 var(--ink); }
    .icon-blocks span:nth-child(2) { margin-top: 23px; background: var(--coral); }
    .icon-blocks span:nth-child(3) { background: #9ed36a; }

    .tower { position: relative; width: 68px; height: 82px; border: 4px solid var(--ink); border-radius: 7px 7px 3px 3px; background: #d79a60; }
    .tower::before { content: ''; position: absolute; left: -13px; top: -27px; width: 84px; height: 40px; border: 4px solid var(--ink); border-radius: 50% 50% 6px 6px; background: #7fbe68; }
    .tower::after { content: ''; position: absolute; top: 31px; left: 28px; width: 10px; height: 20px; border-radius: 3px; background: var(--ink); }

    .archer { position: relative; width: 92px; height: 105px; }
    .archer::before { content: ''; position: absolute; left: 27px; top: 7px; width: 39px; height: 39px; border: 4px solid var(--ink); border-radius: 50%; background: #f2c39b; }
    .archer::after { content: '➶'; position: absolute; left: 7px; top: 41px; color: var(--ink); font-size: 73px; line-height: 1; transform: rotate(-18deg); }

    .hook { color: var(--ink); font-size: 92px; line-height: 1; transform: rotate(-18deg); }

    .turtle { width: 108px; height: 70px; border: 4px solid var(--ink); border-radius: 50%; background: #70b889; box-shadow: 25px 14px 0 -7px #f2c39b; }

    .card-copy { display: flex; align-items: end; justify-content: space-between; gap: 12px; padding-top: 18px; }
    .card-copy h2 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 21px; letter-spacing: -.03em; }
    .card-copy p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .card-copy p::before { content: 'PLAY'; display: inline-block; margin-right: 7px; color: var(--yellow); font-size: 9px; font-weight: 700; letter-spacing: .12em; }
    .arrow { color: var(--yellow); font-size: 25px; transition: transform .2s ease; }
    .game-card:hover .arrow, .game-card:focus-visible .arrow { transform: translate(3px, -3px); color: var(--ink); }

    footer { display: flex; justify-content: space-between; gap: 20px; padding: 0 0 28px; color: var(--muted); font-size: 12px; }
    footer strong { color: var(--ink); font-weight: 700; }

    @media (max-width: 760px) {
      .shell { width: min(100% - 28px, 540px); }
      header { padding-top: 20px; }
      .status { display: none; }
      .intro { padding: 58px 0 32px; }
      .catalog-tools { flex-wrap: wrap; }
      .catalog-tools input, .catalog-tools select { flex: 1 1 180px; }
      .games { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .game-card, .game-card:nth-child(4) { grid-column: span 1; min-height: 240px; padding: 15px; }
      .art { min-height: 112px; }
      .card-copy h2 { font-size: 17px; }
      .card-copy p { font-size: 12px; }
    }

    @media (max-width: 390px) {
      .games { grid-template-columns: 1fr; }
      .game-card, .game-card:nth-child(4) { min-height: 230px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><span class="brand-icon"><img src="../branding/octo-industries-logo-source.jpg" alt=""></span><div class="brand-name">Octo Industries</div></div>
      <div class="status">Game Room / 05 titles ready</div>
    </header>

    <main>
      <section class="intro" aria-labelledby="welcome-title">
        <p class="eyebrow">Octo Industries presents</p>
        <h1 id="welcome-title">Pick a game.<br>Make some noise.</h1>
        <p>A hand-picked arcade shelf for quick sessions, big scores, and one more round. Choose your next challenge below.</p>
      </section>

      <div class="catalog-tools" role="search">
        <input id="game-search" type="search" placeholder="Search games" aria-label="Search games">
        <select id="game-category" aria-label="Filter by category"><option value="all">All categories</option></select>
      </div>
      <section class="games" id="games" aria-label="Games"></section>
    </main>

    <footer><span>Choose a card to launch the game.</span><strong>© 2026 Octo Industries</strong></footer>
  </div>
  <script src="hub/catalog.js"></script>
  <script>
    const games = document.querySelector('#games');
    const search = document.querySelector('#game-search');
    const category = document.querySelector('#game-category');
    const catalog = Array.isArray(window.OCTO_GAMES) ? window.OCTO_GAMES : [];
    [...new Set(catalog.map((game) => game.category))].sort().forEach((value) => category.insertAdjacentHTML('beforeend', `<option value="${value}">${value}</option>`));
    function renderGames() {
      const query = search.value.trim().toLowerCase();
      const selectedCategory = category.value;
      const filtered = catalog.filter((game) => (!query || `${game.title} ${game.description} ${game.category}`.toLowerCase().includes(query)) && (selectedCategory === 'all' || game.category === selectedCategory));
      games.innerHTML = filtered.map((game) => `<a class="game-card" href="${game.launch}" data-game="${game.id}"><div class="art" style="--card-color: ${game.accent}"><img src="${game.thumbnail}" alt="${game.title}"></div><div class="card-copy"><div><h2>${game.title}</h2><p>${game.description} · ${game.category} · v${game.version}</p></div><span class="arrow" aria-hidden="true">↗</span></div></a>`).join('');
    }
    search.addEventListener('input', renderGames);
    category.addEventListener('change', renderGames);
    renderGames();
  </script>
</body>
</html>
