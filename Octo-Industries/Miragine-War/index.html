<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Miragine War</title>
  <link rel="icon" href="../branding/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../branding/favicon.ico">
  <link rel="stylesheet" href="../branding/game-branding.css">
  <script>window.OCTO_GAME_BRANDING_CONFIG = { hubButtonPosition: 'top-left', watermarkPosition: 'none' };</script>
  <script defer src="../branding/game-branding.js"></script>
  <link rel="stylesheet" href="../branding/game-loader.css">
  <script src="../branding/game-loader.js"></script>
  <style>
    :root {
      color-scheme: dark;
      background: #101722;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      background: #101722;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      gap: 0;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .game {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }
  </style>
  <script src="ruffle/ruffle.js"></script>
</head>
<body>
  <div id="game" aria-label="Miragine War game"></div>
  <script>
    window.addEventListener("load", function () {
      OctoLoader.loadRuffle({
        url: "games/miragine-war.swf",
        config: {
          allowScriptAccess: true,
          contextMenu: "off",
          quality: "high",
          scale: "showAll",
          letterbox: "on",
          frameRate: 60
        },
        replace: document.getElementById("game"),
        className: "game",
        coverMs: 2800
      });
    });
  </script>
</body>
</html>
