<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191216">
  <title>Age of War 1 | Octo Industries</title>
  <link rel="icon" href="../branding/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../branding/favicon.ico">
  <link rel="stylesheet" href="../branding/game-branding.css">
  <script defer src="../branding/game-branding.js"></script>
  <link rel="stylesheet" href="src/game.css">
</head>
<body>
  <main class="app">
    <header class="topbar"><div><div class="brand">Age of War 1</div></div><div class="stats" aria-label="Battle status"><div class="stat"><strong id="gold">120</strong>gold</div><div class="stat"><strong id="age">Stone Age</strong>age</div><div class="stat"><strong id="enemy">1000</strong>enemy HP</div></div></header>
    <section class="arena-wrap" aria-label="Age of War battle">
      <canvas id="battlefield" aria-label="Battlefield canvas"></canvas>
      <div class="screen" id="screen"><div class="panel"><div class="eyebrow">Strategy / Evolution</div><h1 id="screen-title">Age of War 1</h1><p id="screen-text"></p><button class="primary" id="start-button" type="button">Begin battle</button></div></div>
    </section>
    <section class="hud"><div class="controls"><button type="button" data-unit>Clubber</button><button type="button" data-unit>Slinger</button><button type="button" id="evolve">Evolve</button></div><p class="hint">Tap units to deploy. Hold your line and evolve.</p></section>
  </main>
  <script src="src/game.js"></script>
</body>
</html>
