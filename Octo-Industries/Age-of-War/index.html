<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Age of War</title>
  <link rel="icon" href="../branding/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../branding/favicon.ico">
  <link rel="stylesheet" href="../branding/game-branding.css">
  <script defer src="../branding/game-branding.js"></script>
  <style>
    :root {
      color-scheme: dark;
      background: #101722;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #101722;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100svh;
      align-items: center;
      justify-content: center;
      gap: 8px;
      overflow: auto;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .game {
      display: block;
      width: min(960px, 100vw);
      height: min(680px, calc(100svh - 48px));
      aspect-ratio: 960 / 680;
      max-width: 100vw;
      max-height: calc(100svh - 48px);
    }
  </style>
  <script src="ruffle/ruffle.js"></script>
</head>
<body>
  <div id="game" aria-label="Age of War game"></div>
  <script>
    window.addEventListener("load", function () {
      window.RufflePlayer.config = {
        splashScreen: false,
        contextMenu: "off",
        quality: "high",
        frameRate: 60,
        preferredRenderer: "webgl"
      };
      var ruffle = window.RufflePlayer.newest();
      var player = ruffle.createPlayer();
      player.className = "game";
      document.getElementById("game").replaceWith(player);
      player.load("games/age-of-war.swf");
    });
  </script>
</body>
</html>
