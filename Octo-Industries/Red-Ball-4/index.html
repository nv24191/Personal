<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10151c">
  <meta name="description" content="Play the original Red Ball 4 browser game.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data: blob:; media-src 'self' data: blob:">
  <title>Red Ball 4</title>
  <link rel="icon" href="../branding/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../branding/favicon.ico">
  <link rel="stylesheet" href="../branding/game-branding.css">
  <script defer src="../branding/game-branding.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="unity-container" aria-label="Red Ball 4 game">
    <canvas id="unity-canvas" tabindex="0" aria-label="Red Ball 4 gameplay"></canvas>
    <section id="loading-screen" role="status" aria-live="polite">
      <h1>Red Ball 4</h1>
      <p id="loading-status">Loading original game files…</p>
      <div class="progress-track"><span id="progress-fill"></span></div>
    </section>
    <p id="unity-message" role="alert" hidden></p>
  </main>
  <script src="platform-compat.js"></script>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const loadingScreen = document.querySelector('#loading-screen');
    const loadingStatus = document.querySelector('#loading-status');
    const progressFill = document.querySelector('#progress-fill');
    const message = document.querySelector('#unity-message');
    const buildUrl = 'Build';
    const config = {
      dataUrl: `${buildUrl}/9fce8ead7dd6a9263cda3ed3ec873dd3.data`,
      frameworkUrl: `${buildUrl}/e8fdbdd07c2824facdf87342f6be608a.js`,
      codeUrl: `${buildUrl}/b48067ed8fa8d994a559745a5a8a38d4.wasm`,
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Yohoho Games',
      productName: 'Red Ball 4',
      productVersion: '1.08.03',
      devicePixelRatio: 1,
      matchWebGLToCanvasSize: true,
      webglContextAttributes: {
        powerPreference: 'high-performance',
      },
    };

    function showMessage(text) {
      message.textContent = text;
      message.hidden = false;
      loadingScreen.hidden = true;
    }

    const loader = document.createElement('script');
    loader.src = `${buildUrl}/10803.loader.js`;
    loader.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        const percent = Math.round(progress * 100);
        progressFill.style.width = `${percent}%`;
        loadingStatus.textContent = `Loading original game files… ${percent}%`;
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        window.pokiBridgeReady();
        loadingScreen.hidden = true;
      }).catch((error) => {
        console.error('Red Ball 4 failed to initialize.', error);
        showMessage('Red Ball 4 could not start. Check that the local game files are being served over HTTP.');
      });
    };
    loader.onerror = () => {
      showMessage('The original Red Ball 4 loader could not be loaded from this project.');
    };
    document.body.append(loader);

    document.addEventListener('pointerdown', () => canvas.focus({ preventScroll: true }));

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch((error) => {
          console.error('Red Ball 4 offline caching could not be enabled.', error);
        });
      });
    }
  </script>
</body>
</html>
