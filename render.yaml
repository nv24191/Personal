services:
  - type: web
    name: octo-industries-game-hub
    runtime: node
    buildCommand: npm --prefix Octo-Industries/BehindTheScenes run sync
    startCommand: npm --prefix Octo-Industries/BehindTheScenes start
    healthCheckPath: /healthz
    disk:
      name: octo-admin-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: OCTO_DATA_DIR
        value: /var/data
      - key: OCTO_ADMIN_PASSWORD_HASH
        sync: false
      - key: GEMINI_API_KEY
        sync: false
